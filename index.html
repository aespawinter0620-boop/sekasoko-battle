const emptyParty=()=>Array(6).fill(null);
const normalizeParty=p=>{
 let out=emptyParty();if(!Array.isArray(p))return out;
 if(p.length<=6){p.slice(0,6).forEach((id,i)=>out[i]=id||null);return out}
 const preferred=[p[0],p[1],p[2],p[5],p[6],p[7]],extras=[p[3],p[4],p[8],p[9]].filter(Boolean);
 preferred.forEach((id,i)=>out[i]=id||null);
 for(const id of extras){if(out.includes(id))continue;let k=out.findIndex(x=>!x);if(k<0)break;out[k]=id}

let selectedParty=0;let parties=(()=>{try{let x=JSON.parse(localStorage.getItem('sekasokoParties'));if(Array.isArray(x)&&x.length===12)return x.map(normalizeParty)}catch(e){}let d=Array.from({length:12},emptyParty);d[0][0]='mizuki';d[1][0]='cow';d[1][1]='shield';d[2][0]='doll';d[2][1]='rin';return d})();
const partyCost=p=>p.reduce((n,id)=>n+(id?(formationRosterData.find(c=>c.id===id)?.cost||1):0),0);const partyCount=p=>p.filter(Boolean).length;const usedPartyOf=id=>parties.findIndex(p=>p.includes(id));const saveParties=()=>localStorage.setItem('sekasokoParties',JSON.stringify(parties));
function renderFormation(){document.querySelector('#partyTabs').innerHTML=parties.map((p,i)=>`<button class="partyTab ${i===selectedParty?'active':''}" data-p="${i}">部隊${i+1}<small>${partyCount(p)?partyCost(p)+'マス':'空'}</small></button>`).join('');document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{selectedParty=+b.dataset.p;renderFormation()});let p=parties[selectedParty];document.querySelector('#partyName').textContent='部隊'+(selectedParty+1);document.querySelector('#partyCount').textContent=partyCost(p)+' / 6マス';let h='';for(let i=0;i<6;i++){let c=formationRosterData.find(x=>x.id===p[i]);let lane=i<3?'前衛':'後衛';h+=c?`<button class="partySlot filled" data-rem-slot="${i}"><span><span class="ico">${c.icon}</span><span class="nm">${c.name}</span></span></button>`:`<div class="partySlot">${i+1}<br>${lane}</div>`}document.querySelector('#partyGrid').innerHTML=h;document.querySelectorAll('[data-rem-slot]').forEach(b=>b.onclick=()=>{parties[selectedParty][+b.dataset.remSlot]=null;renderFormation()});document.querySelector('#formationRoster').innerHTML=formationRosterData.map(c=>{let u=usedPartyOf(c.id);return `<button class="rosterCard ${u>=0?'used':''}" data-add="${c.id}"><span class="rIco">${c.icon}</span><b>${c.name}</b><small>${c.attr}${u>=0?'｜部隊'+(u+1):'｜未編成'}</small></button>`}).join('');document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>toggleChar(b.dataset.add))}
function toggleChar(id){let old=usedPartyOf(id);if(old===selectedParty){let slot=parties[selectedParty].indexOf(id);if(slot>=0)parties[selectedParty][slot]=null;renderFormation();return}if(old>=0){openInfo('編成済み','このキャラは部隊'+(old+1)+'にいます。先に外してください。','⚠️');return}let c=formationRosterData.find(x=>x.id===id);if(partyCost(parties[selectedParty])+c.cost>6){openInfo('編成できません','1部隊は最大6マスです。','⚠️');return}let slot=parties[selectedParty].findIndex(x=>!x);if(slot<0){openInfo('編成できません','空きマスがありません。','⚠️');return}parties[selectedParty][slot]=id;renderFormation()}

function compareTurn(a,b){return (a.next-b.next)||(b.spd-a.spd)||(a.cid-b.cid)}
function clone(x){return JSON.parse(JSON.stringify(x))}
function makePartyUnits(ids,partyIndex=0){return ids.map((id,i)=>{let x=formationRosterData.find(c=>c.id===id);return x?({...clone(x),max:x.hp,rosterId:id,id:'a'+partyIndex+'_'+i,formationSlot:i,homeSlot:i,row:i<3?'front':'back',pulledForward:false,pullVulnerableUntilTurn:0,side:'A',next:baseWait(x)}):null}).filter(Boolean)}
function makeEnemies(f){let mult=1+(f-1)*0.10,frontI=0,backI=0;return enemyBase.map((x,i)=>{const slot=x.row==='front'?frontI++:3+backI++;return({...clone(x),hp:Math.round(x.hp*mult),max:Math.round(x.hp*mult),atk:Math.round(x.atk*(1+(f-1)*0.055)),id:'e'+i,formationSlot:slot,homeSlot:slot,pulledForward:false,pullVulnerableUntilTurn:0,side:'E',next:baseWait(x)})})}
function syncActiveParty(){if(runPartyStates[activePartyIndex])runPartyStates[activePartyIndex]=clone(A)}
function resetTimelineForFloor(){let units=[...runPartyStates.flat().filter(u=>u.hp>0)];units.forEach(u=>u.next=baseWait(u));}
function firstLivingParty(){return runPartyStates.findIndex(p=>p.some(u=>u.hp>0))}
function setActiveParty(i){activePartyIndex=i;A=runPartyStates[i]||[]}
function totalRemainingHP(){syncActiveParty();return runPartyStates.flat().reduce((sum,u)=>sum+Math.max(0,u.hp||0),0)}
function damageRate(){if(!runStartMaxHP)return 0;return Math.max(0,Math.min(100,(1-totalRemainingHP()/runStartMaxHP)*100))}
// 検証用の仮倍率。正式な倍率テーブルは報酬経済設計後に調整する。
function damageRewardMultiplier(rate=damageRate()){if(rate<5)return 3.00;if(rate<10)return 2.50;if(rate<20)return 2.00;if(rate<35)return 1.50;if(rate<50)return 1.00;if(rate<75)return .75;return .50}
function updateDamageUI(){let r=damageRate(),m=damageRewardMultiplier(r),el=document.querySelector('#damageRate'),rw=document.querySelector('#damageReward');if(el)el.textContent='損壊 '+r.toFixed(1)+'%';if(rw)rw.textContent='報酬 ×'+m.toFixed(2)+'（仮）'}
function updateFloorUI(){let b=document.querySelector('#floorBadge');if(b)b.textContent=floor+'F / '+maxFloor+'F';let a=document.querySelector('#autoToggle');if(a){a.textContent='AUTO '+(autoMode?'ON':'OFF');a.classList.toggle('on',autoMode)}updateDamageUI()
 const wf=document.querySelector('#worldFloor');if(wf)wf.textContent=`世界深度 ${worldDepth} / ${floor}F`;
 const td=document.querySelector('#topDamage');if(td)td.textContent=`損壊 ${damageRate().toFixed(1)}%`;
 const tr=document.querySelector('#topReward');if(tr)tr.textContent=`報酬×${damageRewardMultiplier(damageRate()).toFixed(2)}`;
}
function takeFloorSnapshot(){syncActiveParty();floorSnapshot={floor,activePartyIndex,runPartyStates:clone(runPartyStates),enemies:clone(E),turnNo,runLoot,runStartMaxHP}}
function restoreFloorSnapshot(){if(!floorSnapshot)return;floor=floorSnapshot.floor;activePartyIndex=floorSnapshot.activePartyIndex;runPartyStates=clone(floorSnapshot.runPartyStates);A=runPartyStates[activePartyIndex];E=clone(floorSnapshot.enemies);turnNo=floorSnapshot.turnNo;runLoot=floorSnapshot.runLoot;runStartMaxHP=floorSnapshot.runStartMaxHP;currentActor=null;resolvePlayerAction=null;document.querySelector('#skillPanel').classList.remove('show');document.querySelector('#overlay').classList.remove('show');updateFloorUI();renderBattle()}
function prepareSortie(){saveParties();sortieQueue=parties.map((p,i)=>({slot:i,ids:[...p]})).filter(x=>x.ids.some(Boolean));if(!sortieQueue.length)sortieQueue=[{slot:0,ids:['mizuki']}];runPartyStates=sortieQueue.map((x,i)=>makePartyUnits(x.ids,i));runStartMaxHP=runPartyStates.flat().reduce((sum,u)=>sum+u.max,0);floor=1;runLoot=0;turnNo=0;setActiveParty(0);E=makeEnemies(floor);running=false;document.querySelector('#overlay').classList.remove('show');document.querySelector('#skillPanel').classList.remove('show');document.querySelector('#status').textContent='1F｜部隊'+(sortieQueue[0].slot+1)+' 出撃準備';takeFloorSnapshot();updateFloorUI();renderBattle()}
function initBattle(){prepareSortie()}
function deployNextParty(){syncActiveParty();let next=activePartyIndex+1;while(next<runPartyStates.length&&!runPartyStates[next].some(u=>u.hp>0))next++;if(next>=runPartyStates.length)return false;let alive=E.filter(x=>x.hp>0),now=alive.length?Math.min(...alive.map(x=>x.next)):0;setActiveParty(next);A.filter(u=>u.hp>0).forEach(u=>u.next=Math.max(u.next||0,now+baseWait(u)));document.querySelector('#status').textContent='部隊'+(sortieQueue[next].slot+1)+' 投入！';renderBattle();return true}
function nextFloor(){syncActiveParty();floor++;turnNo=0;let first=firstLivingParty();if(first<0)return false;setActiveParty(first);resetTimelineForFloor();E=makeEnemies(floor);takeFloorSnapshot();updateFloorUI();document.querySelector('#status').textContent=floor+'Fへ進行｜HP・固有状態を持ち越し';renderBattle();return true}
function slots(units,side){let html='',rows=side==='A'?['back','front']:['front','back'];for(const row of rows){html+='<div class="col">';for(let i=0;i<3;i++){let u;if(row==='front'){u=units.find(x=>x.hp>0&&x.row==='front'&&x.formationSlot===i)||units.find(x=>x.row==='front'&&x.formationSlot===i)}else{u=units.find(x=>x.hp>0&&x.row==='back'&&(x.homeSlot??x.formationSlot)===i+3)||units.find(x=>x.row==='back'&&(x.homeSlot??x.formationSlot)===i+3)}html+=`<div class="slot ${row}">${u?unitHTML(u):''}</div>`}html+='</div>'}return html}
function unitHTML(u){return `<div class="unit ${u.hp<=0?'dead':''}" id="${u.id}" data-unit="${u.id}" data-cid="${u.cid}" role="button" tabindex="0" aria-label="${u.name}の詳細を開く"><div class="sprite">${u.sprite?`<img src="${u.sprite}" alt="${u.name}">`:u.icon}</div><div class="name">${u.name}</div><div class="unitBottom"><div class="hpbar"><div class="hp" style="width:${Math.max(0,u.hp/u.max*100)}%"></div></div></div></div>`}
function forecast(n=10){
 const sim=allUnits().filter(u=>u.hp>0).map(u=>({id:u.id,name:u.name,side:u.side,next:u.next,spd:u.spd,cid:u.cid,ct:u.skill?.ct||0,cost:actionCost(u)}));
 const out=[];
 for(let i=0;i<n&&sim.length;i++){sim.sort(compareTurn);const u=sim[0];out.push({...u});u.next+=u.cost}
 return out;
}
function renderOrder(){
 const list=forecast(10),bar=document.querySelector('#orderBar');
 bar.innerHTML=list.map(u=>{const src=allUnits().find(x=>x.id===u.id);const visual=(src?.actionSprite||src?.sprite)?`<img src="${src.actionSprite||src.sprite}" alt="">`:`<span>${src?.icon||'?'}</span>`;return `<div class="orderChip actionFace ${u.side==='E'?'enemyOrder':''}" title="${u.name}" aria-label="${u.side==='A'?'味方':'敵'} ${u.name}">${visual}</div>`}).join('');
}
function unitStateTags(u){
 const tags=[];
 if(u.cid===101){const m=u.mirror||0;tags.push(`🪞 明鏡止水 ${m}`);tags.push(`回避 ${Math.min(80,m*5)}%`)}
 if(u.poison)tags.push(`☠️ 毒 ${u.poison}`);
 if(u.paralysis)tags.push(`⚡ 麻痺 ${u.paralysis}`);
 if(u.healBlock)tags.push(`❤️‍🩹 回復阻害 ${u.healBlock}`);
 if(u.shield)tags.push(`🛡️ ガラスの盾 ${u.shield}`);
 if(u.invincible)tags.push(`⭐️ 無敵 ${u.invincible}`);
 if(u.sword)tags.push(`🗡️ ${u.sword}`);
 return tags;
}
function renderActorStates(){
 const actor=currentActor&&currentActor.side==='A'?currentActor:null;
 const title=document.querySelector('#skillActor'),box=document.querySelector('#actorStates');if(!title||!box)return;
 if(!actor){title.textContent='技を選択';box.innerHTML='';return}
 title.textContent=actor.name+'｜技を選択';
 const tags=unitStateTags(actor);box.innerHTML=(tags.length?tags:['状態異常なし']).map(x=>`<span class="actorStateChip">${x}</span>`).join('');
}
function openBattleUnitDetail(u){
 if(!u)return;const tags=unitStateTags(u),side=u.side==='A'?'味方':'敵',row=u.row==='front'?'前衛':'後衛';
 const visual=u.sprite?`<img src="${u.actionSprite||u.sprite}" alt="${u.name}">`:u.icon;
 const power=calcPower({hp:u.max,atk:u.atk||0,def:u.def||0,spd:u.spd||0}),floors=getFloorCounts()[u.rosterId||u.name]||0;
 document.querySelector('#modalCard').innerHTML=`<div class="battleDetailCard"><div class="cardHead"><h2>${u.name}</h2></div><div class="battleDetailHero"><div class="battleDetailIcon ${u.sprite?'faceCrop':''}">${visual}</div><div class="battleDetailMeta">${side}｜${row}<br>総合戦力 ${power.toLocaleString()}<br>総階層踏破 ${floors.toLocaleString()}F<br>現在ACTION ${Math.round(u.next||0)}</div></div><div class="stats"><div class="stat">HP<b>${Math.max(0,u.hp)} / ${u.max}</b></div><div class="stat">ATK<b>${u.atk??'-'}</b></div><div class="stat">DEF<b>${u.def??'-'}</b></div><div class="stat">SPD<b>${u.spd??'-'}</b></div></div><div class="skills"><b>バフ・デバフ・固有スタック</b><div class="battleStateList">${(tags.length?tags:['付与状態なし']).map(x=>`<span class="battleStateTag">${x}</span>`).join('')}</div></div><button class="battleBackBtn" onclick="closeModal()">戻る</button></div>`;
 document.querySelector('#modal').classList.add('show');
}
function bindBattleUnitDetails(){
 document.querySelectorAll('#battleScreen [data-unit]').forEach(el=>{const open=()=>openBattleUnitDetail(allUnits().find(u=>u.id===el.dataset.unit));el.onclick=open;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}});
}
function renderBattle(){
 document.querySelector('#allyArmy').innerHTML=slots(A,'A');document.querySelector('#enemyArmy').innerHTML=slots(E,'E');
 document.querySelector('#turn').textContent=running?`部隊${(sortieQueue[activePartyIndex]?.slot??activePartyIndex)+1}`:'部隊-';updateFloorUI();
 const now=allUnits().filter(x=>x.hp>0).sort(compareTurn).slice(0,5);
 document.querySelector('#order').innerHTML=now.map((u,i)=>`<span class="chip ${i===0?'active':''}">${u.side==='A'?'味':'敵'} ${u.name}</span>`).join('');renderOrder();renderActorStates();bindBattleUnitDetails();
}
function damagePop(el,n){if(!el)return;const r=el.getBoundingClientRect(),app=document.querySelector('.app').getBoundingClientRect(),d=document.createElement('div');d.className='damagePop';d.textContent=n==='MISS'?'MISS':'-'+n;d.style.left=(r.left-app.left+r.width/2)+'px';d.style.top=(r.top-app.top+20)+'px';document.querySelector('.app').appendChild(d);setTimeout(()=>d.remove(),700)}
function living(arr){return arr.filter(x=>x.hp>0)}
function pullForwardForSlot(side,frontSlot){
 if(frontSlot<0||frontSlot>2)return null;
 const army=side==='A'?A:E;
 const front=army.find(x=>x.formationSlot===frontSlot&&x.hp>0);
 if(front)return null;
 const back=army.find(x=>x.row==='back'&&(x.homeSlot??x.formationSlot)===frontSlot+3&&x.hp>0);
 if(!back)return null;
 const hpBefore=back.hp,maxBefore=back.max,nextBefore=back.next;
 const deadFront=army.find(x=>x!==back&&x.hp<=0&&x.row==='front'&&x.formationSlot===frontSlot);
 if(deadFront)deadFront.formationSlot=-1;
 back.formationSlot=frontSlot;
 back.row='front';
 back.pulledForward=true;
 back.pullVulnerableUntilTurn=turnNo+1;
 back.hp=hpBefore;back.max=maxBefore;back.next=nextBefore;
 document.querySelector('#status').textContent=`${back.name} が後衛から前衛へ引きずり出された！ HP ${Math.max(0,back.hp)}/${back.max}`;
 return back;
}
function handleFrontlineDeath(u){
 if(!u||u.hp>0)return null;
 const slot=(u.formationSlot??u.homeSlot);
 if(slot>=0&&slot<3)return pullForwardForSlot(u.side,slot);
 return null;
}
function target(arr,random=false){let alive=living(arr),front=alive.filter(x=>x.row==='front'),pool=front.length?front:alive;return random?pool[Math.floor(Math.random()*pool.length)]:pool[0]}
function tryEvade(t){if(t.cid!==101||!t.mirror)return false;const rate=Math.min(80,t.mirror*5);if(Math.random()*100<rate){t.mirror--;document.querySelector('#status').textContent=`${t.name} が回避！ MISS　🪞${t.mirror}`;return true}return false}
async function mizukiAttack(att,defenders){
 if(att.hp<=0)return;let t=target(defenders,true);if(!t)return;
 document.querySelector('#status').textContent=`${att.name}「固有技《明鏡止水》」 CT2`;
 let attacker=document.getElementById(att.id);if(attacker)attacker.classList.add('attacking');
 for(let hit=0;hit<2&&t.hp>0;hit++){await sleep(150);let targetEl=document.getElementById(t.id);document.querySelector('#flash').classList.add('on');if(targetEl)targetEl.classList.add('hit');const dmg=att.atk;t.hp-=dmg;damagePop(targetEl,dmg);await sleep(140);document.querySelector('#flash').classList.remove('on');if(targetEl)targetEl.classList.remove('hit')}
 att.mirror=Math.min(16,(att.mirror||0)+1);document.querySelector('#status').textContent=`《明鏡止水》2Hit必中！ 🪞${att.mirror}`;
 if(t.hp<=0){let targetEl=document.getElementById(t.id);if(targetEl){targetEl.classList.add('dying');await sleep(300)}const pulled=handleFrontlineDeath(t);if(pulled){renderBattle();await sleep(500)}}await sleep(100)
}
function waitForMizukiSkill(u){if(autoMode)return Promise.resolve();currentActor=u;document.querySelector('#skillPanel').classList.add('show');document.querySelector('#status').textContent='水月 鏡日のターン：技を選択';renderBattle();return new Promise(r=>resolvePlayerAction=r)}
function openMizukiSkill(){if(!running||!currentActor||currentActor.cid!==101)return;document.querySelector('#skillPanel').classList.add('show')}

async function attack(att,defenders){
 if(att.hp<=0)return;
 const t=target(defenders);
 if(!t)return;
 document.querySelector('#status').textContent=`${att.name}「${att.skill.name}」 CT${att.skill.ct}`;
 const attacker=document.getElementById(att.id);
 if(attacker)attacker.classList.add('attacking');
 await sleep(180);
 const targetEl=document.getElementById(t.id);
 document.querySelector('#flash').classList.add('on');
 if(targetEl)targetEl.classList.add('hit');
 if(t.side==='A'&&!debugInvincible&&tryEvade(t)){
   damagePop(targetEl,'MISS');
   await sleep(220);
   document.querySelector('#flash').classList.remove('on');
   if(targetEl)targetEl.classList.remove('hit');
   return;
 }
 const dmg=(t.side==='A'&&debugInvincible)?0:att.atk;
 if(dmg>0)t.hp=Math.max(0,t.hp-dmg);
 damagePop(targetEl,dmg);
 await sleep(170);
 document.querySelector('#flash').classList.remove('on');
 if(targetEl)targetEl.classList.remove('hit');
 if(t.hp<=0){
   if(targetEl)targetEl.classList.add('dying');
   document.querySelector('#status').textContent=`${t.name} を倒した！`;
   await sleep(420);
   const pulled=handleFrontlineDeath(t);
   if(pulled){
     // 同じ攻撃処理はここで完全終了。新前衛へダメージを引き継がない。
     if(t.side==='A')syncActiveParty();
     renderBattle();
     await sleep(500);
   }
 }
 await sleep(120);
}
async function battle(){
 if(running)return;running=true;document.querySelector('#status').textContent=floor+'F｜SPD＋CTタイムライン';updateFloorUI();renderBattle();
 while(running){
   while(living(E).length&&turnNo<600){
     if(!living(A).length){syncActiveParty();document.querySelector('#status').textContent='部隊'+(sortieQueue[activePartyIndex].slot+1)+' 壊滅';await sleep(450);if(!deployNextParty())break;await sleep(350)}
     const candidates=allUnits().filter(u=>u.hp>0).sort(compareTurn),u=candidates[0];if(!u)break;
     turnNo++;
     if(u.side==='A'&&u.cid===101){await waitForMizukiSkill(u);if(!running)return;await mizukiAttack(u,E);currentActor=null;resolvePlayerAction=null}else{await attack(u,u.side==='A'?E:A)}
     u.next+=actionCost(u);syncActiveParty();renderBattle();
   }
   if(!living(E).length){addFloorClearForRun();const baseReward=10*floor,mult=damageRewardMultiplier();runLoot+=Math.round(baseReward*mult);document.querySelector('#status').textContent=floor+'F CLEAR｜損壊率 '+damageRate().toFixed(1)+'%｜報酬 ×'+mult.toFixed(2);await sleep(500);if(floor>=maxFloor){running=false;showRunResult(true);return}await sleep(250);if(!nextFloor()){running=false;showRunResult(false);return}continue}
   running=false;showRunResult(false);return
 }
}
function showRunResult(win){document.querySelector('#resultText').textContent=win?'10F 踏破！':'GAME OVER';document.querySelector('#resultDetail').textContent=win?'検証ダンジョン踏破｜獲得素材 '+runLoot:floor+'Fで全出撃部隊が壊滅｜獲得素材 '+runLoot;document.querySelector('#continueFloor').style.display=win?'none':'block';document.querySelector('#again').textContent=win?'素材を持って拠点へ戻る':'素材を持って拠点へ戻る';document.querySelector('#overlay').classList.add('show')}
function retreatHome(){running=false;if(resolvePlayerAction){let r=resolvePlayerAction;resolvePlayerAction=null;r()}document.querySelector('#skillPanel').classList.remove('show');document.querySelector('#overlay').classList.remove('show');openInfo('攻略終了','獲得素材 '+runLoot+' を持ち帰りました。次回の世界深度攻略は1Fから開始します。','🎒');showScreen('home')}
document.querySelector('#mizukiSkill').onclick=()=>{if(resolvePlayerAction){document.querySelector('#skillPanel').classList.remove('show');const r=resolvePlayerAction;resolvePlayerAction=null;r()}};document.querySelector('#autoToggle').onclick=()=>{autoMode=!autoMode;if(autoMode&&resolvePlayerAction){document.querySelector('#skillPanel').classList.remove('show');const r=resolvePlayerAction;resolvePlayerAction=null;r()}updateFloorUI()};document.querySelector('#homeBack').onclick=()=>{if(confirm('今回の攻略を終了して、素材を持って拠点へ戻りますか？'))retreatHome()};document.querySelector('#continueFloor').onclick=()=>{restoreFloorSnapshot();autoMode=false;updateFloorUI();setTimeout(()=>battle(),80)};document.querySelector('#again').onclick=()=>retreatHome();
const dp=document.querySelector('#debugPanel');document.querySelector('#debugOpen').onclick=()=>dp.classList.add('show');document.querySelector('#debugClose').onclick=()=>dp.classList.remove('show');
function dbgStatus(msg){document.querySelector('#status').textContent='DEBUG: '+msg;renderBattle()}
document.querySelector('#dbgEnemy1').onclick=()=>{E.forEach(x=>{if(x.hp>0)x.hp=1});dbgStatus('敵HPを1に変更')};document.querySelector('#dbgHealA').onclick=()=>{A.forEach(x=>x.hp=x.max);dbgStatus('味方を全回復')};document.querySelector('#dbgHealE').onclick=()=>{E.forEach(x=>x.hp=x.max);dbgStatus('敵を全回復')};document.querySelector('#dbgAtkA').onclick=()=>{A.forEach(x=>x.atk+=100);dbgStatus('味方ATK +100')};document.querySelector('#dbgAtkE').onclick=()=>{E.forEach(x=>x.atk+=100);dbgStatus('敵ATK +100')};document.querySelector('#dbgWin').onclick=()=>{E.forEach(x=>x.hp=0);renderBattle();dp.classList.remove('show');document.querySelector('#resultText').textContent='WIN';document.querySelector('#overlay').classList.add('show')};document.querySelector('#dbgInv').onclick=e=>{debugInvincible=!debugInvincible;e.currentTarget.textContent='味方無敵 '+(debugInvincible?'ON':'OFF');e.currentTarget.classList.toggle('on',debugInvincible);dbgStatus('味方無敵 '+(debugInvincible?'ON':'OFF'))};document.querySelector('#dbgSpeed').onclick=e=>{debugSpeed=debugSpeed===1?5:debugSpeed===5?10:1;e.currentTarget.textContent='速度 ×'+debugSpeed;dbgStatus('戦闘速度 ×'+debugSpeed)};
renderHome();initBattle();
</script></body></html>
