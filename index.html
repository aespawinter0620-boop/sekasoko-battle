/* BATTLE */
#battleScreen{background:radial-gradient(circle at 50% 42%,#252030 0,#11131d 45%,#080a10 100%)}.top{height:58px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#0b0d15dd;border-bottom:1px solid #ffffff18}.floor{font-weight:800;letter-spacing:.08em}.turn{font-size:12px;color:#aaa}.battle{flex:1;display:grid;grid-template-columns:1fr 42px 1fr;align-items:center;padding:8px;min-height:0}.army{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.col{display:grid;grid-template-rows:repeat(5,1fr);gap:7px}.laneLabel{font-size:10px;text-align:center;color:#8d8d99;margin-bottom:4px}.slot{height:min(13.2vh,82px);min-height:58px;border:1px solid #ffffff24;border-radius:12px;background:#ffffff08;position:relative;display:flex;align-items:center;justify-content:center;transition:.18s}.slot.front{background:#ffffff0e}.unit{width:86%;height:86%;border-radius:10px;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;background:linear-gradient(145deg,#403047,#211e2b);border:1px solid #ffffff20;transition:.18s}.enemy .unit{background:linear-gradient(145deg,#49302f,#271c22)}.unit.hit{transform:translateX(6px);filter:brightness(1.8)}.ally .unit.hit{transform:translateX(-6px)}.sprite{font-size:25px;line-height:1;width:54px;height:44px;display:flex;align-items:center;justify-content:center}.sprite img{max-width:100%;max-height:100%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 3px 2px #0008)}.unit.attacking{z-index:8;animation:allyLunge .42s ease-in-out}.enemy .unit.attacking{animation:enemyLunge .42s ease-in-out}@keyframes allyLunge{0%{transform:translateX(0)}45%{transform:translateX(52px) scale(1.08)}100%{transform:translateX(0)}}@keyframes enemyLunge{0%{transform:translateX(0)}45%{transform:translateX(-52px) scale(1.08)}100%{transform:translateX(0)}}.damagePop{position:absolute;z-index:30;font-size:24px;font-weight:1000;color:#fff;text-shadow:0 2px 0 #000,0 0 8px #fff;pointer-events:none;animation:damageFly .65s ease-out forwards}@keyframes damageFly{0%{transform:translate(-50%,0) scale(.7);opacity:0}20%{opacity:1}100%{transform:translate(-50%,-38px) scale(1.2);opacity:0}}.unit.dying{animation:dieOut .5s ease forwards}@keyframes dieOut{0%{opacity:1;transform:scale(1)}55%{filter:brightness(2);transform:scale(1.08)}100%{opacity:0;transform:scale(.45) translateY(16px)}}.name{font-size:10px;font-weight:700;margin-top:2px;white-space:nowrap}.hpbar{position:absolute;bottom:4px;width:82%;height:4px;background:#0008;border-radius:3px;overflow:hidden}.hp{height:100%;background:#e8e8e8;transition:.25s}.dead{opacity:.15;filter:grayscale(1)}.middle{text-align:center;color:#777;font-size:11px}.vs{font-size:18px;font-weight:900;color:#ddd}.panel{padding:9px 12px max(12px,env(safe-area-inset-bottom));background:#0a0c13ee;border-top:1px solid #ffffff18}.status{height:24px;text-align:center;font-size:12px;color:#c8c4cb}.controls{display:flex;gap:8px}.btn{border:1px solid #ffffff28;background:#1a1d29;border-radius:12px;padding:12px 10px;flex:1;font-weight:800}.start{background:#eee;color:#111;border-color:#fff}.btn:disabled{opacity:.35}.order{display:flex;gap:4px;overflow:hidden;margin-bottom:7px}.chip{font-size:9px;padding:4px 6px;border-radius:10px;background:#ffffff0d;color:#aaa;white-space:nowrap}.chip.active{background:#eee;color:#111}.overlay{position:absolute;inset:0;background:#05060bcc;display:none;align-items:center;justify-content:center;z-index:15}.overlay.show{display:flex}.result{text-align:center}.result h1{font-size:42px;margin:0 0 12px;letter-spacing:.08em}.result button{padding:12px 26px;border:0;border-radius:12px;font-weight:800;color:#111}.attackFlash{position:absolute;inset:58px 0 100px;pointer-events:none;opacity:0;background:radial-gradient(circle,#ffffff33,transparent 55%);transition:.12s}.attackFlash.on{opacity:1}.debugBtn{position:absolute;right:10px;top:66px;z-index:4;border:1px solid #ffffff28;background:#111522dd;border-radius:10px;padding:7px 9px;font-size:11px;font-weight:800}.debugPanel{position:absolute;inset:0;background:#05060bef;z-index:19;display:none;padding:72px 16px 18px;overflow:auto}.debugPanel.show{display:block}.debugCard{max-width:430px;margin:auto;background:#111521;border:1px solid #ffffff25;border-radius:16px;padding:14px}.debugHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.debugGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.debugAction{border:1px solid #ffffff25;background:#202536;border-radius:10px;padding:11px 7px;font-weight:700;font-size:12px}.debugAction.on{background:#eee;color:#111}.debugClose{border:0;background:#33394c;border-radius:9px;padding:8px 12px}.debugInfo{font-size:11px;color:#aaa;margin:10px 0 0;line-height:1.5}.planBox{margin:8px 10px 0;padding:9px;border:1px solid #ffffff20;background:#0c101acc;border-radius:12px}.planTitle{font-size:11px;font-weight:900;letter-spacing:.08em;color:#cfd5e6;margin-bottom:7px}.orderBar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.orderChip{min-width:62px;border:1px solid #ffffff25;background:#171c2a;border-radius:9px;padding:6px 5px;text-align:center;font-size:9px;line-height:1.25}.orderChip b{display:block;font-size:13px;margin-bottom:2px}.orderChip small{display:block;color:#8d93a5;font-size:8px;margin-top:2px}.orderChip.enemyOrder{border-color:#8f5c5c;background:#281a20}.orderChip.selected{outline:2px solid #fff;background:#2b3248}.orderHelp{font-size:9px;color:#8e96aa;margin-top:6px}

/* FORMATION */
#formationScreen{background:#080a10}.formationTop{height:58px;padding:9px 10px;display:flex;gap:8px;align-items:center;background:#0b0e16;border-bottom:1px solid #ffffff1c}.formationTop h2{margin:0;flex:1;font-size:16px}.formationTop small{display:block;color:#9fa4b5;font-size:9px}.miniBtn{border:1px solid #ffffff2b;background:#171b28;border-radius:9px;padding:8px;font-size:10px}.formationBody{flex:1;min-height:0;display:flex;flex-direction:column}.partyTabs{display:flex;gap:6px;overflow-x:auto;padding:8px}.partyTab{min-width:62px;border:1px solid #ffffff20;background:#131722;border-radius:9px;padding:7px 4px;font-size:9px;font-weight:900}.partyTab.active{background:#eee;color:#111}.partyArea{padding:7px 10px;border-block:1px solid #ffffff16}.partyMeta{display:flex;justify-content:space-between;font-size:11px;margin-bottom:6px}.partyGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.partySlot{height:55px;border:1px dashed #ffffff25;background:#0d1018;border-radius:8px;color:#697083;font-size:8px;display:flex;align-items:center;justify-content:center;text-align:center}.partySlot.filled{border-style:solid;background:#171c29;color:#fff}.partySlot .ico{font-size:20px;display:block}.partySlot .nm{display:block;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.partyNote{padding:7px 10px;font-size:9px;color:#8f97aa}.roster{flex:1;min-height:0;overflow:auto;padding:4px 10px 80px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-content:start}.rosterCard{border:1px solid #ffffff22;background:#121621;border-radius:9px;padding:7px 4px;text-align:center;font-size:9px}.rosterCard.used{opacity:.4}.rosterCard .rIco{font-size:25px}.rosterCard b,.rosterCard small{display:block}.rosterCard small{color:#8f97aa}.formationBottom{position:absolute;bottom:0;left:0;right:0;padding:9px 10px max(9px,env(safe-area-inset-bottom));display:flex;gap:8px;background:#090b13ee}.formationBottom button{flex:1;border:1px solid #ffffff2b;border-radius:10px;padding:11px;background:#171b28;font-weight:900}.formationBottom .saveFormation{background:#eee;color:#111}

.autoBtn.on{background:#eee;color:#111}.floorBadge{font-weight:1000;color:#f1e8c7}.resultActions{display:flex;flex-direction:column;gap:8px;margin-top:12px}.resultActions button{width:100%;border:1px solid #ffffff30;background:#171b28;border-radius:10px;padding:11px;font-weight:900}.resultActions .primary{background:#eee;color:#111}

<body><main class="app">
<section class="screen active" id="home">
  <div class="homeTop"><div class="brand"><b>セカソコ</b><small>お気に入りの彼女と、世界の底へ。</small></div><div class="resource">世界深度 1<br>記憶の欠片 300</div></div>
  <div class="hub">
    <div class="abyss"></div><div class="areaTitle"><b id="areaName">透波</b><small id="areaCount">1 / 3</small></div>
    <div class="characters" id="homeCharacters"></div>
    <button class="hubObject" id="book">📖 分厚い本</button><button class="hubObject" id="shop">🎁 宝箱</button>
    <div class="sortieActions"><button class="descend" id="descend">次の階層へ</button><button class="formation" id="formation">配置</button></div>
  </div><div class="attrNav" id="attrNav"></div>
</section>

<section class="screen" id="formationScreen"><div class="formationTop"><button class="miniBtn" id="formationBack">← 拠点</button><h2>部隊編成<small>最大12部隊 ／ 1部隊最大10マス</small></h2><button class="miniBtn" id="clearParty">この部隊を空に</button><button class="miniBtn" id="clearAllParties">全12部隊を空に</button></div><div class="formationBody"><div class="partyTabs" id="partyTabs"></div><div class="partyArea"><div class="partyMeta"><b id="partyName">部隊1</b><span id="partyCount">0 / 10マス</span></div><div class="partyGrid" id="partyGrid"></div></div><div class="partyNote">タップで追加／解除。未編成キャラがいても出撃可能。部隊1→2→…の順で投入。</div><div class="roster" id="formationRoster"></div></div><div class="formationBottom"><button id="formationHome">キャンセル</button><button class="saveFormation" id="saveFormation">編成を保存</button></div></section>
<section class="screen" id="battleScreen">
<div class="top"><div class="floor">世界深度 1 ／ 1F</div><div class="turn" id="turn">戦闘準備</div></div>
<section class="battle"><div><div class="laneLabel">味方　後衛　｜　前衛</div><div class="army ally" id="allyArmy"></div></div><div class="middle"><div class="vs">VS</div><div>→</div></div><div><div class="laneLabel">前衛　｜　後衛　敵</div><div class="army enemy" id="enemyArmy"></div></div></section>
<div class="attackFlash" id="flash"></div><button class="debugBtn" id="debugOpen">🛠 DEBUG</button>
<div class="debugPanel" id="debugPanel"><div class="debugCard"><div class="debugHead"><b>DEBUG MODE</b><button class="debugClose" id="debugClose">閉じる</button></div><div class="debugGrid"><button class="debugAction" id="dbgEnemy1">敵HPを1</button><button class="debugAction" id="dbgHealA">味方全回復</button><button class="debugAction" id="dbgHealE">敵全回復</button><button class="debugAction" id="dbgAtkA">味方ATK +100</button><button class="debugAction" id="dbgAtkE">敵ATK +100</button><button class="debugAction" id="dbgWin">即勝利</button><button class="debugAction" id="dbgInv">味方無敵 OFF</button><button class="debugAction" id="dbgSpeed">速度 ×1</button></div><div class="debugInfo">開発者用。販売版では通常プレイヤーから隠す想定。</div></div></div>
<div class="skillPanel" id="skillPanel"><div class="skillTitle">水月 鏡日｜技を選択</div><button class="skillBtn" id="mizukiSkill">固有技《明鏡止水》<small>前列ランダム1体／ATK依存2Hit／必中／🪞+1　CT2（検証値）</small></button></div><section class="panel"><div class="order" id="order"></div><div class="status" id="status">SPDから初期行動順を自動計算</div><div class="planBox"><div class="planTitle">ACTION ORDER｜行動予測</div><div class="orderBar" id="orderBar"></div><div class="orderHelp">SPD＋使用スキルCTで自動更新。同着時は固定IDで決定します。</div></div><div class="controls"><button class="btn autoBtn" id="autoToggle">AUTO OFF</button><span class="floorBadge" id="floorBadge">1F / 10F</span><button class="btn" id="homeBack">撤退して拠点へ</button></div></section>
<div class="overlay" id="overlay"><div class="result"><h1 id="resultText">WIN</h1><div id="resultDetail"></div><div class="resultActions"><button class="primary" id="continueFloor">この階層からコンティニュー</button><button id="again">素材を持って拠点へ戻る</button></div></div></div>
</section>
<div class="modal" id="modal"><div class="card" id="modalCard"></div></div>
</main>
<script>
const attributes=[{id:'suppa',name:'透波',count:'1/3',unlocked:true},{id:'cow',name:'乳牛',count:'1/3',unlocked:true},{id:'vampire',name:'吸血',count:'0/3',unlocked:false},{id:'shield',name:'盾姫',count:'0/3',unlocked:false},{id:'poison',name:'毒牙',count:'0/3',unlocked:false},{id:'undead',name:'屍霊',count:'0/3',unlocked:false},{id:'water',name:'水棲',count:'0/3',unlocked:false},{id:'time',name:'時空',count:'0/3',unlocked:false},{id:'treasure',name:'宝盗',count:'0/3',unlocked:false},{id:'gamble',name:'賭博',count:'0/3',unlocked:false},{id:'abyss',name:'深淵',count:'0/3',unlocked:false}];
const homeRoster={suppa:[{name:'水月 鏡日',icon:'🌙',sub:'透波｜技巧型',hp:88,atk:29,def:12,spd:18,skills:['固有技《明鏡止水》','《影縫い》','《明鏡止水の極み》','パッシブ《水月家の血統》']}],cow:[{name:'牛娘',icon:'🐮',sub:'乳牛｜タンク・支援',hp:145,atk:18,def:28,spd:8,skills:['開発用スキル枠','重装・防御テスト','支援挙動テスト']} ]};
let currentAttr=localStorage.getItem('sekasokoHomeAttr')||'suppa';
function showScreen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}
function renderHome(){const a=attributes.find(x=>x.id===currentAttr)||attributes[0];document.querySelector('#areaName').textContent=a.unlocked?a.name:'？？？';document.querySelector('#areaCount').textContent=a.unlocked?a.count:'未発見';const chars=a.unlocked?(homeRoster[a.id]||[]):[];let html=chars.map((c,i)=>`<div class="char" data-char="${i}"><div class="portrait">${c.icon}</div><div class="charName">${c.name}</div><div class="charSub">${c.sub}</div></div>`).join('');for(let i=chars.length;i<3;i++)html+=`<div class="char emptyChar"><div class="portrait">？</div><div class="charName">${a.unlocked?'未加入':'？？？'}</div><div class="charSub">${a.unlocked?'空席':'未発見'}</div></div>`;document.querySelector('#homeCharacters').innerHTML=html;document.querySelectorAll('[data-char]').forEach(el=>el.onclick=()=>openCharacter(chars[+el.dataset.char]));document.querySelector('#attrNav').innerHTML=attributes.map(x=>`<button class="attrBtn ${x.id===currentAttr?'active':''} ${!x.unlocked?'locked':''}" data-attr="${x.id}">${x.unlocked?x.name:'？？？'}<span>${x.unlocked?x.count:'未発見'}</span></button>`).join('');document.querySelectorAll('[data-attr]').forEach(el=>el.onclick=()=>{const x=attributes.find(a=>a.id===el.dataset.attr);if(!x.unlocked){openInfo('？？？','まだ、この気配の正体を知らない。','❔');return}currentAttr=x.id;localStorage.setItem('sekasokoHomeAttr',currentAttr);renderHome()})}
function openCharacter(c){document.querySelector('#modalCard').innerHTML=`<div class="cardHead"><h2>${c.name}</h2><button class="close" onclick="closeModal()">閉じる</button></div><div class="charHero">${c.icon}</div><div style="text-align:center;color:#aaa;font-size:12px">${c.sub}</div><div class="stats"><div class="stat">HP<b>${c.hp}</b></div><div class="stat">ATK<b>${c.atk}</b></div><div class="stat">DEF<b>${c.def}</b></div><div class="stat">SPD<b>${c.spd}</b></div></div><div class="skills"><b>SKILLS</b><br>${c.skills.map(x=>'・'+x).join('<br>')}<br><br><span style="color:#8d93a5">※ Ver.0.5では個別管理画面の導線確認用。</span></div>`;document.querySelector('#modal').classList.add('show')}
function openInfo(title,text,icon){document.querySelector('#modalCard').innerHTML=`<div class="cardHead"><h2>${title}</h2><button class="close" onclick="closeModal()">閉じる</button></div><div class="coming"><span class="big">${icon}</span>${text}</div>`;document.querySelector('#modal').classList.add('show')}
function closeModal(){document.querySelector('#modal').classList.remove('show')}
document.querySelector('#book').onclick=()=>openInfo('図鑑','分厚い本を開いた。図鑑画面は次段階で実装。','📖');document.querySelector('#shop').onclick=()=>openInfo('欠片ショップ','記憶の欠片でアイテムを購入する場所。ショップ本体は次段階で実装。','🎁');document.querySelector('#descend').onclick=()=>{prepareSortie();showScreen('battleScreen');setTimeout(()=>battle(),80)};document.querySelector('#formation').onclick=()=>{renderFormation();showScreen('formationScreen')};document.querySelector('#modal').onclick=e=>{if(e.target.id==='modal')closeModal()};

const formationRosterData=[

let selectedParty=0;let parties=(()=>{try{let x=JSON.parse(localStorage.getItem('sekasokoParties'));if(Array.isArray(x)&&x.length===12)return x}catch(e){}return [['mizuki'],['cow','shield'],['doll','rin'],[],[],[],[],[],[],[],[],[]]})();
const partyCost=p=>p.reduce((n,id)=>n+(formationRosterData.find(c=>c.id===id)?.cost||1),0);const usedPartyOf=id=>parties.findIndex(p=>p.includes(id));const saveParties=()=>localStorage.setItem('sekasokoParties',JSON.stringify(parties));
function renderFormation(){document.querySelector('#partyTabs').innerHTML=parties.map((p,i)=>`<button class="partyTab ${i===selectedParty?'active':''}" data-p="${i}">部隊${i+1}<small>${p.length?partyCost(p)+'マス':'空'}</small></button>`).join('');document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{selectedParty=+b.dataset.p;renderFormation()});let p=parties[selectedParty];document.querySelector('#partyName').textContent='部隊'+(selectedParty+1);document.querySelector('#partyCount').textContent=partyCost(p)+' / 10マス';let h='';for(let i=0;i<10;i++){let c=formationRosterData.find(x=>x.id===p[i]);h+=c?`<button class="partySlot filled" data-rem="${c.id}"><span><span class="ico">${c.icon}</span><span class="nm">${c.name}</span></span></button>`:`<div class="partySlot">${i+1}</div>`}document.querySelector('#partyGrid').innerHTML=h;document.querySelectorAll('[data-rem]').forEach(b=>b.onclick=()=>{parties[selectedParty]=parties[selectedParty].filter(x=>x!==b.dataset.rem);renderFormation()});document.querySelector('#formationRoster').innerHTML=formationRosterData.map(c=>{let u=usedPartyOf(c.id);return `<button class="rosterCard ${u>=0?'used':''}" data-add="${c.id}"><span class="rIco">${c.icon}</span><b>${c.name}</b><small>${c.attr}${u>=0?'｜部隊'+(u+1):'｜未編成'}</small></button>`}).join('');document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>toggleChar(b.dataset.add))}
function toggleChar(id){let old=usedPartyOf(id);if(old===selectedParty){parties[selectedParty]=parties[selectedParty].filter(x=>x!==id);renderFormation();return}if(old>=0){openInfo('編成済み','このキャラは部隊'+(old+1)+'にいます。先に外してください。','⚠️');return}let c=formationRosterData.find(x=>x.id===id);if(partyCost(parties[selectedParty])+c.cost>10){openInfo('編成できません','1部隊は最大10マスです。','⚠️');return}parties[selectedParty].push(id);renderFormation()}
document.querySelector('#formationBack').onclick=()=>showScreen('home');document.querySelector('#formationHome').onclick=()=>showScreen('home');document.querySelector('#saveFormation').onclick=()=>{saveParties();showScreen('home')};document.querySelector('#clearParty').onclick=()=>{parties[selectedParty]=[];renderFormation()};document.querySelector('#clearAllParties').onclick=()=>{if(confirm('すべての編成を解除しますか？')){parties=Array.from({length:12},()=>[]);saveParties();renderFormation()}};
const allies=[
{name:'水月 鏡日',icon:'🌙',hp:110,atk:29,row:'front',cid:101,spd:120,mirror:0,skill:{name:'固有技《明鏡止水》',ct:2}},
{name:'牛娘',icon:'🐮',hp:145,atk:18,row:'front',cid:201,spd:55,skill:{name:'大地の一撃（仮）',ct:5}},
{name:'白盾姫',icon:'♜',hp:132,atk:16,row:'front',cid:301,spd:90,skill:{name:'盾撃（仮）',ct:3}},
{name:'人形王女',icon:'✦',hp:78,atk:20,row:'back',cid:302,spd:70,skill:{name:'操糸（仮）',ct:2}},
{name:'凛',icon:'◆',hp:88,atk:24,row:'back',cid:303,spd:70,skill:{name:'一閃（仮）',ct:4}}
];
const enemyBase=[
{name:'深層スライム',icon:'●',sprite:'assets/slime.png',hp:70,atk:17,row:'front',cid:1001,spd:100,skill:{name:'体当たり',ct:2}},
{name:'骸の少女',icon:'☠',hp:95,atk:22,row:'front',cid:1002,spd:70,skill:{name:'骨砕き',ct:3}},
{name:'影喰い',icon:'◉',hp:76,atk:26,row:'back',cid:1003,spd:90,skill:{name:'影撃ち',ct:5}},
{name:'黒兎',icon:'♠',hp:66,atk:24,row:'back',cid:1004,spd:55,skill:{name:'黒爪',ct:2}}
];
let A=[],E=[],running=false,turnNo=0,debugSpeed=1,debugInvincible=false,currentActor=null,resolvePlayerAction=null,sortieQueue=[],activePartyIndex=0;
let floor=1,maxFloor=10,autoMode=false,runPartyStates=[],floorSnapshot=null,runLoot=0;
const sleep=m=>new Promise(r=>setTimeout(r,m/debugSpeed));
const baseWait=u=>Math.max(20,Math.round(1000/Math.sqrt(u.spd)));
const actionCost=u=>baseWait(u)+(u.skill?.ct||0)*10;
function allUnits(){return [...A,...E]}
function compareTurn(a,b){return (a.next-b.next)||(b.spd-a.spd)||(a.cid-b.cid)}
function clone(x){return JSON.parse(JSON.stringify(x))}
function makePartyUnits(ids){return ids.map((id,i)=>{let x=formationRosterData.find(c=>c.id===id);return x?({...clone(x),max:x.hp,id:'a'+i,side:'A',next:baseWait(x)}):null}).filter(Boolean)}
function makeEnemies(f){let mult=1+(f-1)*0.10;return enemyBase.map((x,i)=>({...clone(x),hp:Math.round(x.hp*mult),max:Math.round(x.hp*mult),atk:Math.round(x.atk*(1+(f-1)*0.055)),id:'e'+i,side:'E',next:baseWait(x)}))}
function syncActiveParty(){if(runPartyStates[activePartyIndex])runPartyStates[activePartyIndex]=clone(A)}
function resetTimelineForFloor(){let units=[...runPartyStates.flat().filter(u=>u.hp>0)];units.forEach(u=>u.next=baseWait(u));}
function firstLivingParty(){return runPartyStates.findIndex(p=>p.some(u=>u.hp>0))}
function setActiveParty(i){activePartyIndex=i;A=runPartyStates[i]||[]}
function updateFloorUI(){let b=document.querySelector('#floorBadge');if(b)b.textContent=floor+'F / '+maxFloor+'F';let a=document.querySelector('#autoToggle');if(a){a.textContent='AUTO '+(autoMode?'ON':'OFF');a.classList.toggle('on',autoMode)}}
function takeFloorSnapshot(){syncActiveParty();floorSnapshot={floor,activePartyIndex,runPartyStates:clone(runPartyStates),enemies:clone(E),turnNo,runLoot}}
function restoreFloorSnapshot(){if(!floorSnapshot)return;floor=floorSnapshot.floor;activePartyIndex=floorSnapshot.activePartyIndex;runPartyStates=clone(floorSnapshot.runPartyStates);A=runPartyStates[activePartyIndex];E=clone(floorSnapshot.enemies);turnNo=floorSnapshot.turnNo;runLoot=floorSnapshot.runLoot;currentActor=null;resolvePlayerAction=null;document.querySelector('#skillPanel').classList.remove('show');document.querySelector('#overlay').classList.remove('show');updateFloorUI();renderBattle()}
function prepareSortie(){saveParties();sortieQueue=parties.map((p,i)=>({slot:i,ids:[...p]})).filter(x=>x.ids.length);if(!sortieQueue.length)sortieQueue=[{slot:0,ids:['mizuki']}];runPartyStates=sortieQueue.map(x=>makePartyUnits(x.ids));floor=1;runLoot=0;turnNo=0;setActiveParty(0);E=makeEnemies(floor);running=false;document.querySelector('#overlay').classList.remove('show');document.querySelector('#skillPanel').classList.remove('show');document.querySelector('#status').textContent='1F｜部隊'+(sortieQueue[0].slot+1)+' 出撃準備';takeFloorSnapshot();updateFloorUI();renderBattle()}
function initBattle(){prepareSortie()}
function deployNextParty(){syncActiveParty();let next=activePartyIndex+1;while(next<runPartyStates.length&&!runPartyStates[next].some(u=>u.hp>0))next++;if(next>=runPartyStates.length)return false;let alive=E.filter(x=>x.hp>0),now=alive.length?Math.min(...alive.map(x=>x.next)):0;setActiveParty(next);A.filter(u=>u.hp>0).forEach(u=>u.next=Math.max(u.next||0,now+baseWait(u)));document.querySelector('#status').textContent='部隊'+(sortieQueue[next].slot+1)+' 投入！';renderBattle();return true}
function nextFloor(){syncActiveParty();floor++;turnNo=0;let first=firstLivingParty();if(first<0)return false;setActiveParty(first);resetTimelineForFloor();E=makeEnemies(floor);runLoot+=10*floor;takeFloorSnapshot();updateFloorUI();document.querySelector('#status').textContent=floor+'Fへ進行｜HP・固有状態を持ち越し';renderBattle();return true}
function slots(units,side){let html='',rows=side==='A'?['back','front']:['front','back'];for(const row of rows){html+='<div class="col">';for(let i=0;i<5;i++){let u=units.filter(x=>x.row===row)[i];html+=`<div class="slot ${row}">${u?unitHTML(u):''}</div>`}html+='</div>'}return html}
function unitHTML(u){return `<div class="unit ${u.hp<=0?'dead':''}" id="${u.id}" data-unit="${u.id}"><div class="sprite">${u.sprite?`<img src="${u.sprite}" alt="">`:u.icon}</div><div class="name">${u.name}</div><div class="hpbar"><div class="hp" style="width:${Math.max(0,u.hp/u.max*100)}%"></div></div>${u.cid===101?`<div class="mirrorBadge">🪞${u.mirror||0} / 回避${Math.min(80,(u.mirror||0)*5)}%</div>`:''}</div>`}
function forecast(n=10){
 const sim=allUnits().filter(u=>u.hp>0).map(u=>({id:u.id,name:u.name,side:u.side,next:u.next,spd:u.spd,cid:u.cid,ct:u.skill?.ct||0,cost:actionCost(u)}));
 const out=[];
 for(let i=0;i<n&&sim.length;i++){sim.sort(compareTurn);const u=sim[0];out.push({...u});u.next+=u.cost}
 return out;
}
function renderOrder(){
 const list=forecast(10),bar=document.querySelector('#orderBar');
 bar.innerHTML=list.map((u,i)=>`<div class="orderChip ${u.side==='E'?'enemyOrder':''}"><b>${i+1}</b>${u.side==='A'?'味':'敵'} ${u.name}<small> SPD${u.spd} / CT${u.ct}</small></div>`).join('');
}
function renderBattle(){
 document.querySelector('#allyArmy').innerHTML=slots(A,'A');document.querySelector('#enemyArmy').innerHTML=slots(E,'E');
 document.querySelector('#turn').textContent=running?`${floor}F｜部隊${(sortieQueue[activePartyIndex]?.slot??activePartyIndex)+1}｜ACTION ${turnNo}`:'戦闘準備';updateFloorUI();
 const now=allUnits().filter(x=>x.hp>0).sort(compareTurn).slice(0,5);
 document.querySelector('#order').innerHTML=now.map((u,i)=>`<span class="chip ${i===0?'active':''}">${u.side==='A'?'味':'敵'} ${u.name}</span>`).join('');renderOrder();const mz=A?.find(x=>x.cid===101);const mzEl=mz&&document.getElementById(mz.id);if(mzEl)mzEl.onclick=openMizukiSkill;
}
function damagePop(el,n){if(!el)return;const r=el.getBoundingClientRect(),app=document.querySelector('.app').getBoundingClientRect(),d=document.createElement('div');d.className='damagePop';d.textContent=n==='MISS'?'MISS':'-'+n;d.style.left=(r.left-app.left+r.width/2)+'px';d.style.top=(r.top-app.top+20)+'px';document.querySelector('.app').appendChild(d);setTimeout(()=>d.remove(),700)}
function living(arr){return arr.filter(x=>x.hp>0)}
function target(arr,random=false){let alive=living(arr),front=alive.filter(x=>x.row==='front'),pool=front.length?front:alive;return random?pool[Math.floor(Math.random()*pool.length)]:pool[0]}
function tryEvade(t){if(t.cid!==101||!t.mirror)return false;const rate=Math.min(80,t.mirror*5);if(Math.random()*100<rate){t.mirror--;document.querySelector('#status').textContent=`${t.name} が回避！ MISS　🪞${t.mirror}`;return true}return false}
async function mizukiAttack(att,defenders){
 if(att.hp<=0)return;let t=target(defenders,true);if(!t)return;
 document.querySelector('#status').textContent=`${att.name}「固有技《明鏡止水》」 CT2`;
 let attacker=document.getElementById(att.id);if(attacker)attacker.classList.add('attacking');
 for(let hit=0;hit<2&&t.hp>0;hit++){await sleep(150);let targetEl=document.getElementById(t.id);document.querySelector('#flash').classList.add('on');if(targetEl)targetEl.classList.add('hit');const dmg=att.atk;t.hp-=dmg;damagePop(targetEl,dmg);await sleep(140);document.querySelector('#flash').classList.remove('on');if(targetEl)targetEl.classList.remove('hit')}
 att.mirror=Math.min(16,(att.mirror||0)+1);document.querySelector('#status').textContent=`《明鏡止水》2Hit必中！ 🪞${att.mirror}`;
 if(t.hp<=0){let targetEl=document.getElementById(t.id);if(targetEl){targetEl.classList.add('dying');await sleep(300)}}await sleep(100)
}
function waitForMizukiSkill(u){if(autoMode)return Promise.resolve();currentActor=u;document.querySelector('#skillPanel').classList.add('show');document.querySelector('#status').textContent='水月 鏡日のターン：技を選択';renderBattle();return new Promise(r=>resolvePlayerAction=r)}
function openMizukiSkill(){if(!running||!currentActor||currentActor.cid!==101)return;document.querySelector('#skillPanel').classList.add('show')}

async function attack(att,defenders){
 if(att.hp<=0)return;let t=target(defenders);if(!t)return;
 document.querySelector('#status').textContent=`${att.name}「${att.skill.name}」 CT${att.skill.ct}`;
 let attacker=document.getElementById(att.id);if(attacker)attacker.classList.add('attacking');await sleep(180);let targetEl=document.getElementById(t.id);document.querySelector('#flash').classList.add('on');if(targetEl)targetEl.classList.add('hit');if(t.side==='A'&&!debugInvincible&&tryEvade(t)){damagePop(targetEl,'MISS');await sleep(220);return}const dmg=(t.side==='A'&&debugInvincible)?0:att.atk;if(dmg>0)t.hp-=dmg;damagePop(targetEl,dmg);await sleep(170);document.querySelector('#flash').classList.remove('on');if(t.hp<=0&&targetEl){targetEl.classList.remove('hit');targetEl.classList.add('dying');document.querySelector('#status').textContent=`${t.name} を倒した！`;await sleep(420)}await sleep(120)
}
async function battle(){
 if(running)return;running=true;document.querySelector('#status').textContent=floor+'F｜SPD＋CTタイムライン';updateFloorUI();renderBattle();
 while(running){
   while(living(E).length&&turnNo<600){
     if(!living(A).length){syncActiveParty();document.querySelector('#status').textContent='部隊'+(sortieQueue[activePartyIndex].slot+1)+' 壊滅';await sleep(450);if(!deployNextParty())break;await sleep(350)}
     const candidates=allUnits().filter(u=>u.hp>0).sort(compareTurn),u=candidates[0];if(!u)break;
     turnNo++;
     if(u.side==='A'&&u.cid===101){await waitForMizukiSkill(u);if(!running)return;await mizukiAttack(u,E);currentActor=null;resolvePlayerAction=null}else{await attack(u,u.side==='A'?E:A)}
     u.next+=actionCost(u);syncActiveParty();renderBattle();
   }
   if(!living(E).length){runLoot+=10*floor;if(floor>=maxFloor){running=false;showRunResult(true);return}document.querySelector('#status').textContent=floor+'F CLEAR！';await sleep(650);if(!nextFloor()){running=false;showRunResult(false);return}continue}
   running=false;showRunResult(false);return
 }
}
function showRunResult(win){document.querySelector('#resultText').textContent=win?'10F 踏破！':'GAME OVER';document.querySelector('#resultDetail').textContent=win?'検証ダンジョン踏破｜獲得素材 '+runLoot:floor+'Fで全出撃部隊が壊滅｜獲得素材 '+runLoot;document.querySelector('#continueFloor').style.display=win?'none':'block';document.querySelector('#again').textContent=win?'素材を持って拠点へ戻る':'素材を持って拠点へ戻る';document.querySelector('#overlay').classList.add('show')}
function retreatHome(){running=false;if(resolvePlayerAction){let r=resolvePlayerAction;resolvePlayerAction=null;r()}document.querySelector('#skillPanel').classList.remove('show');document.querySelector('#overlay').classList.remove('show');openInfo('攻略終了','獲得素材 '+runLoot+' を持ち帰りました。次回の世界深度攻略は1Fから開始します。','🎒');showScreen('home')}
document.querySelector('#mizukiSkill').onclick=()=>{if(resolvePlayerAction){document.querySelector('#skillPanel').classList.remove('show');const r=resolvePlayerAction;resolvePlayerAction=null;r()}};document.querySelector('#autoToggle').onclick=()=>{autoMode=!autoMode;if(autoMode&&resolvePlayerAction){document.querySelector('#skillPanel').classList.remove('show');const r=resolvePlayerAction;resolvePlayerAction=null;r()}updateFloorUI()};document.querySelector('#homeBack').onclick=()=>{if(confirm('今回の攻略を終了して、素材を持って拠点へ戻りますか？'))retreatHome()};document.querySelector('#continueFloor').onclick=()=>{restoreFloorSnapshot();autoMode=false;updateFloorUI();setTimeout(()=>battle(),80)};document.querySelector('#again').onclick=()=>retreatHome();
const dp=document.querySelector('#debugPanel');document.querySelector('#debugOpen').onclick=()=>dp.classList.add('show');document.querySelector('#debugClose').onclick=()=>dp.classList.remove('show');
function dbgStatus(msg){document.querySelector('#status').textContent='DEBUG: '+msg;renderBattle()}
document.querySelector('#dbgEnemy1').onclick=()=>{E.forEach(x=>{if(x.hp>0)x.hp=1});dbgStatus('敵HPを1に変更')};document.querySelector('#dbgHealA').onclick=()=>{A.forEach(x=>x.hp=x.max);dbgStatus('味方を全回復')};document.querySelector('#dbgHealE').onclick=()=>{E.forEach(x=>x.hp=x.max);dbgStatus('敵を全回復')};document.querySelector('#dbgAtkA').onclick=()=>{A.forEach(x=>x.atk+=100);dbgStatus('味方ATK +100')};document.querySelector('#dbgAtkE').onclick=()=>{E.forEach(x=>x.atk+=100);dbgStatus('敵ATK +100')};document.querySelector('#dbgWin').onclick=()=>{E.forEach(x=>x.hp=0);renderBattle();dp.classList.remove('show');document.querySelector('#resultText').textContent='WIN';document.querySelector('#overlay').classList.add('show')};document.querySelector('#dbgInv').onclick=e=>{debugInvincible=!debugInvincible;e.currentTarget.textContent='味方無敵 '+(debugInvincible?'ON':'OFF');e.currentTarget.classList.toggle('on',debugInvincible);dbgStatus('味方無敵 '+(debugInvincible?'ON':'OFF'))};document.querySelector('#dbgSpeed').onclick=e=>{debugSpeed=debugSpeed===1?5:debugSpeed===5?10:1;e.currentTarget.textContent='速度 ×'+debugSpeed;dbgStatus('戦闘速度 ×'+debugSpeed)};
renderHome();initBattle();
</script></body></html>
