<section id="home"><h1>セカソコ <small>VER.600 作業版</small></h1><div class="sub">お気に入りの彼女と、世界の底へ。<br>第二世代・新カード戦闘基盤</div><h2 style="font-size:15px">部隊編成 <span id="partyCount"></span></h2><div class="sub">配置先を選び、キャラクターを選択。後衛は同じ段の前衛が必要です。</div><div id="formation" class="formationGrid"></div><button id="remove" class="minor">選択マスから外す</button><p id="homeStatus" role="status"></p><div id="roster" class="roster"></div><button id="start" class="primary">1Fへ出撃</button><p class="sub">VER.600の動作範囲：1F〜2F。編成・遠征は今回限りの一時状態です。保存・音響・3F以降の接続は未実装。</p><p class="verification">敵は通常行動のみの検証設定です。ゲームバランスの正式採用を意味しません。</p></section>

const RULES=Object.freeze({attack:.15,defense:.15,draw:5,hand:20,enemyDelay:280,verificationLastFloor:2});
class Battle {
 constructor({random=Math.random,notify=()=>{},schedule=(fn,ms)=>setTimeout(fn,ms),unschedule=id=>clearTimeout(id)}={}){this.random=random;this.notify=notify;this.schedule=schedule;this.unschedule=unschedule;this.generation=0;this.timers=new Map();this.state={phase:'home'};}
 cancel(){this.generation++;for(const [id,resolve] of this.timers){this.unschedule(id);resolve(false)}this.timers.clear()}
 wait(ms){const token=this.generation;return new Promise(resolve=>{const id=this.schedule(()=>{this.timers.delete(id);resolve(token===this.generation)},ms);this.timers.set(id,resolve)})}

 shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(this.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
 createCard(type){if(!['attack','defense'].includes(type))throw Error('Unknown card');const s=this.state,c={instanceId:`r${this.generation}-c${++s.serial}`,type};s.ledger.add(c.instanceId);return c}
 start(party){if(!Array.isArray(party)||party.length!==6||!party.some(Boolean))return false;
 const ids=party.filter(Boolean);if(new Set(ids).size!==ids.length||ids.some(id=>!ROSTER.some(r=>r.rosterId===id))||party.some((id,i)=>i>=3&&id&&!party[i-3]))return false;
 this.cancel();this.state={phase:'starting',floor:1,turn:0,chain:0,cost:0,serial:0,ledger:new Set(),draw:[],hand:[],discard:[],pendingDraw:0,allies:party.flatMap((id,slot)=>id?[{...ROSTER.find(r=>r.rosterId===id),slot,hp:ROSTER.find(r=>r.rosterId===id).maxHp,block:0}]:[]),enemies:[],selected:ids[0],target:null,message:'出撃',log:[],fault:''};
 for(let i=0;i<5;i++)for(const type of ['attack','defense'])this.state.draw.push(this.createCard(type));this.shuffle(this.state.draw);this.spawn();this.beginPlayer();return true;
 }
 alive(side){return this.state[side].filter(u=>u.hp>0)}
 front(side){return this.alive(side).filter(u=>u.slot<3).sort((a,b)=>a.slot-b.slot)}
 promote(side){const all=this.state[side];for(const u of all)if(u.hp<=0)u.slot=-1;for(let c=0;c<3;c++){if(!all.some(u=>u.hp>0&&u.slot===c)){const rear=all.find(u=>u.hp>0&&u.slot===c+3);if(rear)rear.slot=c}}}
 spawn(){const s=this.state,slots=Array(6).fill(null);const count=2+Math.floor(this.random()*3);s.enemies=[];
 for(let i=0;i<count;i++){const template=ROSTER[Math.floor(this.random()*2)],preferred=template.rosterId==='nagi'?[3,4,5,0,1,2]:[0,1,2,3,4,5];const slot=preferred.find(k=>!slots[k]&&(k<3||slots[k-3]));slots[slot]=true;const maxHp=Math.round(100*(1+(s.floor-1)*.1));s.enemies.push({rosterId:template.rosterId,instanceId:`r${this.generation}-f${s.floor}-e${i}`,name:`★1 ${template.name}の残像`,sprite:template.sprite,slot,homeSlot:slot,maxHp,hp:maxHp,atk:Math.round(100*(1+(s.floor-1)*.005)),def:100,block:0})}
 s.target=this.front('enemies')[0].instanceId;
 }
 log(message){const s=this.state;s.message=message;s.log.push(message);if(s.log.length>150)s.log.shift()}
 beginPlayer(){const s=this.state;if(!this.alive('allies').length)return this.finish('gameover','GAME OVER');s.phase='player';s.turn++;s.cost=Battle.cost(this.alive('allies').length);s.pendingDraw=5;this.drawPending();this.log(`${s.floor}F｜PLAYER PHASE ${s.turn}`);this.emit()}
 static cost(n){return n<=0?0:n<=2?3:n<=4?4:5}
 drawPending(){const s=this.state;while(s.pendingDraw>0&&s.hand.length<=20){if(!s.draw.length){s.draw=this.shuffle(s.discard.splice(0));if(!s.draw.length){s.pendingDraw=0;break}}s.hand.push(s.draw.pop());s.pendingDraw--;if(s.hand.length>20)break}}
 discardOverflow(id){const s=this.state;if(s.phase!=='player'||s.hand.length<=20)return false;const i=s.hand.findIndex(c=>c.instanceId===id);if(i<0)return false;s.discard.push(s.hand.splice(i,1)[0]);this.drawPending();this.emit();return true}
 canInput(){const s=this.state;return s.phase==='player'&&s.hand.length<=20&&s.pendingDraw===0}
 selectAlly(id){if(!this.canInput()||!this.alive('allies').some(a=>a.rosterId===id))return false;this.state.selected=id;this.emit();return true}
 selectEnemy(id){if(!this.canInput()||!this.front('enemies').some(e=>e.instanceId===id))return false;this.state.target=id;this.emit();return true}
 damage(unit,raw,ally){const absorbed=Math.min(unit.block,raw);unit.block-=absorbed;const loss=Math.min(unit.hp,raw-absorbed);unit.hp-=loss;if(ally&&loss>0)this.state.chain=0;return {loss,absorbed}}
 use(id,direct=null){const s=this.state;if(!this.canInput()||s.cost<1)return false;const i=s.hand.findIndex(c=>c.instanceId===id);if(i<0)return false;const card=s.hand[i];let actor=this.alive('allies').find(a=>a.rosterId===s.selected),target;
 if(card.type==='defense'&&direct){if(direct.side!=='ally')return false;actor=this.alive('allies').find(a=>a.rosterId===direct.id)}
 if(!actor)return false;
 if(card.type==='attack'){if(direct&&direct.side!=='enemy')return false;target=this.front('enemies').find(e=>e.instanceId===(direct?.id||s.target));if(!target)return false}
 // All guards precede mutation; synchronous commit prevents duplicate use.
 s.cost--;s.discard.push(s.hand.splice(i,1)[0]);
 if(card.type==='defense'){s.selected=actor.rosterId;const n=Math.floor(actor.def*RULES.defense);actor.block+=n;this.log(`${actor.name}｜BLOCK +${n}`)}else{s.target=target.instanceId;const multiplier=1+.05*s.chain,raw=Math.floor(actor.atk*RULES.attack*multiplier);this.damage(target,raw,false);s.chain++;this.log(`${actor.name} → ${target.name}｜${raw} ×${multiplier.toFixed(2)}`);this.promote('enemies');s.target=this.front('enemies').find(e=>e.instanceId===s.target)?.instanceId||this.front('enemies')[0]?.instanceId||null;if(!this.alive('enemies').length)s.phase='reward'}
 this.emit();return true;
 }
 enemyPlan(enemy){const targets=this.front('allies'),target=targets[(enemy.homeSlot%3)%targets.length];return target?{target,damage:enemy.homeSlot<3?20:15}:null}

 try{for(const enemy of this.alive('enemies')){if(!await this.wait(RULES.enemyDelay)||token!==this.generation||s!==this.state||s.phase!=='enemy')return false;const plan=this.enemyPlan(enemy);if(plan){const hit=this.damage(plan.target,plan.damage,true);this.log(`${enemy.name} → ${plan.target.name}｜HP -${hit.loss} / BLOCK -${hit.absorbed}`);this.promote('allies');if(!this.alive('allies').length){this.finish('gameover','GAME OVER');return true}if(!this.alive('allies').some(a=>a.rosterId===s.selected))s.selected=this.front('allies')[0].rosterId;this.emit()}}
 if(token===this.generation&&s===this.state&&s.phase==='enemy')this.beginPlayer();return true
 }catch(e){if(token===this.generation)this.fail(e);return false}
 }
 reward(type){const s=this.state;if(s.phase!=='reward'||(type!==null&&!['attack','defense'].includes(type)))return false;s.phase='transition';if(type){s.draw.push(this.createCard(type));this.shuffle(s.draw)}s.discard.push(...s.hand.splice(0));s.pendingDraw=0;
 if(s.floor>=RULES.verificationLastFloor){this.finish('complete','2F CLEAR｜VER.600の動作範囲を完了');return true}
 s.floor++;for(const a of s.allies)a.block=0;this.spawn();this.beginPlayer();return true;
 }
 finish(phase,message){this.cancel();this.state.phase=phase;this.state.pendingDraw=0;this.log(message);this.emit()}
 retreat(){if(this.state.phase==='home')return false;this.finish('retreated','撤退｜今回の一時状態は終了');return true}
 home(){this.cancel();this.state={phase:'home'};this.emit()}
 fail(e){this.cancel();this.state.phase='error';this.state.fault=String(e?.message||e);this.emit()}
 assertLedger(){const s=this.state;if(!s.ledger)return;const ids=[...s.draw,...s.hand,...s.discard].map(c=>c.instanceId);if(ids.length!==s.ledger.size||new Set(ids).size!==ids.length||ids.some(id=>!s.ledger.has(id)))throw Error('カード台帳の不整合')}
}

const $=id=>document.getElementById(id),escapeHtml=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let party=['mizuki','yuzu','hathor','nagi','baal','hamuraruna'],slotSelected=0,gesture=null,pan=null,selectedCard=null,raf=0,lastClick=0;
const game=new Battle({notify:render});
function resetGesture(){const g=gesture,oldPan=pan;gesture=null;pan=null;cancelAnimationFrame(raf);raf=0;document.querySelectorAll('.ghost').forEach(e=>e.remove());document.querySelectorAll('.source,.dropReady').forEach(e=>e.classList.remove('source','dropReady'));for(const item of [g,oldPan])if(item)for(const el of [$('hand'),$('guide')])try{if(el.hasPointerCapture(item.pointer))el.releasePointerCapture(item.pointer)}catch{} }
function safe(fn){return (...args)=>{try{const result=fn(...args);if(result?.catch)result.catch(fail);return result}catch(e){fail(e)}}}
function fail(e){resetGesture();console.error(e);game.cancel();game.state.phase='error';game.state.fault=String(e.message||e);render()}
function formation(){ $('partyCount').textContent=`${party.filter(Boolean).length} / 6`;$('formation').innerHTML=[3,0,4,1,5,2].map(i=>`<button class="formationSlot ${i===slotSelected?'selected':''}" data-slot="${i}">${i<3?'前衛':'後衛'} ${i%3+1}｜${escapeHtml(ROSTER.find(r=>r.rosterId===party[i])?.name||'空き')}</button>`).join('');$('roster').innerHTML=ROSTER.map(r=>`<button class="rosterCard ${party.includes(r.rosterId)?'used':''}" data-roster="${r.rosterId}"><img src="${r.sprite}" alt=""><span>${r.name}<br><small>CID ${r.cid}｜HP ${r.maxHp}<br>ATK ${r.atk} / DEF ${r.def}</small></span></button>`).join('');$('start').disabled=!party.some(Boolean)}
$('formation').onclick=e=>{const b=e.target.closest('[data-slot]');if(b){slotSelected=+b.dataset.slot;formation()}};
$('roster').onclick=e=>{const b=e.target.closest('[data-roster]');if(!b)return;const id=b.dataset.roster,i=party.indexOf(id);if(slotSelected>=3&&!party[slotSelected-3]){$('homeStatus').textContent='同じ段の前衛を先に配置してください。';return}if(i>=0&&i!==slotSelected){$('homeStatus').textContent='配置済みです。外してから別のマスへ配置してください。';return}party[slotSelected]=id;$('homeStatus').textContent='';formation()};
$('remove').onclick=()=>{if(slotSelected<3&&party[slotSelected+3]){$('homeStatus').textContent='同じ段の後衛を先に外してください。';return}party[slotSelected]=null;formation()};
$('start').onclick=safe(()=>{resetGesture();$('logSheet').hidden=true;game.start(party)});
$('retreat').onclick=safe(()=>{resetGesture();$('logSheet').hidden=true;game.retreat()});
$('end').onclick=safe(()=>{if(!gesture&&!pan&&$('logSheet').hidden)return game.endPhase()});
$('logOpen').onclick=()=>{resetGesture();$('logs').innerHTML=game.state.log.map(x=>`<li>${escapeHtml(x)}</li>`).join('');$('logSheet').hidden=false};$('logClose').onclick=()=>{$('logSheet').hidden=true};
function unit(u,side){if(!u)return '<div class="empty" aria-label="空き"></div>';const s=game.state,enemy=side==='enemy';let intent=0;for(const e of game.alive('enemies')){const plan=game.enemyPlan(e);if(plan?.target===u)intent+=plan.damage}const target=enemy&&u.instanceId===s.target;return `<button class="unit ${enemy?'enemy':''} ${!enemy&&u.rosterId===s.selected?'selected':''}" data-side="${side}" data-unit="${enemy?u.instanceId:u.rosterId}" aria-label="${escapeHtml(u.name)} ${u.slot<3?'前衛':'後衛'} HP ${u.hp} BLOCK ${u.block}"><span class="art"><img draggable="false" src="${u.sprite}" alt="${escapeHtml(u.name)}"></span>${enemy?`<span class="intent">攻 ${u.homeSlot<3?20:15}</span>`:''}${target?'<span class="reticle"><b>TARGET</b></span>':''}${intent?`<span class="reticle red"><b>TARGET ${intent}</b></span>`:''}<span class="overlay"><span class="shieldRow"><span class="shield"><svg viewBox="0 0 24 28"><path d="M2 2L12 0L22 2V14Q22 22 12 27Q2 22 2 14Z" fill="#174b68" stroke="#b6eaff"/></svg><b>${u.block}</b></span></span><span class="unitName">${escapeHtml(u.name)}</span><span class="hpTrack"><span class="hpFill" style="width:${100*u.hp/u.maxHp}%"></span><span class="hpText">${u.hp}/${u.maxHp}</span></span><span class="break">BREAK —</span></span></button>`}
function cardHtml(c){return `<strong>${c.type==='attack'?'攻撃':'防御'}</strong><span class="cost">1</span><p>${c.type==='attack'?'選択味方 ATK15%<br>黄色TARGETへ1Hit':'選択味方 DEF15%<br>本人のBLOCKに加算'}</p><small>共有・通常カード ／ 合成不可</small>`}
function renderHand(){const s=game.state;if(gesture)return;const lane=$('hand'),rail=$('rail'),ids=new Set(s.hand.map(c=>c.instanceId));for(const node of [...rail.children])if(!ids.has(node.dataset.card))node.remove();for(const c of s.hand){let node=[...rail.children].find(n=>n.dataset.card===c.instanceId);if(!node){node=document.createElement('button');node.dataset.card=c.instanceId;node.innerHTML=cardHtml(c);rail.append(node)}node.className=`card ${c.type} ${selectedCard===c.instanceId?'selected':''} ${s.hand.length>20?'overflow':''}`;node.setAttribute('aria-label',`${c.type==='attack'?'攻撃':'防御'} COST1 ${c.instanceId}`)}
 const n=s.hand.length,w=innerWidth<=360?99:108,a=Math.max(220,lane.clientWidth),step=n<=5?Math.min(56,Math.max(36,(a-w-20)/Math.max(1,n-1))):n<=10?46:45,extent=w+step*Math.max(0,n-1),offset=n>10?25:Math.max(15,(a-extent)/2);rail.style.width=`${Math.max(a,offset+extent+(n>10?56:15))}px`;s.hand.forEach((c,i)=>{const node=[...rail.children].find(n=>n.dataset.card===c.instanceId),t=n===1?0:(i/(n-1)-.5)*2;node.style.left=`${offset+step*i}px`;node.style.setProperty('--angle',`${t*10}deg`);node.style.setProperty('--y',`${Math.abs(t)*8}px`);node.style.zIndex=i+1})}
function render(){const s=game.state;if(s.phase!=='player')resetGesture();$('home').hidden=s.phase!=='home';$('battle').hidden=s.phase==='home';if(s.phase==='home'){formation();return}if(!s.allies){$('result').hidden=false;$('resultPanel').innerHTML='<h2>停止しました</h2><button data-home>編成へ戻る</button>';return}
 $('battle').style.backgroundImage=`url("assets/backgrounds/${s.floor%2===0?'偶数階.png':'奇数階.png'}")`;
 const hp=s.allies.reduce((v,u)=>v+u.hp,0),max=s.allies.reduce((v,u)=>v+u.maxHp,0);$('hud').innerHTML=`<span>深度 ${s.floor}F</span><span>残存 ${(hp/max*100).toFixed(1)}%</span><span>OVERKILL —</span><span>💎 —</span>`;$('phase').textContent=s.phase==='player'?`PLAYER ${s.turn}`:s.phase==='enemy'?'ENEMY':'';$('message').textContent=s.message;$('cost').textContent=`COST ${s.cost} / ${Battle.cost(game.alive('allies').length)}`;$('end').disabled=!game.canInput();$('selection').textContent=s.hand.length>20?'21枚目：捨てるカードを選択':`${s.allies.find(a=>a.rosterId===s.selected)?.name||'—'}｜CHAIN ${s.chain} ×${(1+s.chain*.05).toFixed(2)}`;$('counts').textContent=`山${s.draw.length} 手${s.hand.length} 捨${s.discard.length}`;
 $('allies').innerHTML=[3,0,4,1,5,2].map(slot=>unit(s.allies.find(a=>a.hp>0&&a.slot===slot),'ally')).join('');$('enemies').innerHTML=[0,3,1,4,2,5].map(slot=>unit(s.enemies.find(a=>a.hp>0&&a.slot===slot),'enemy')).join('');renderHand();
 const terminal=['gameover','retreated','complete','error'].includes(s.phase);$('result').hidden=!(terminal||s.phase==='reward');if(s.phase==='reward')$('resultPanel').innerHTML=`<h2>${s.floor}F CLEAR</h2><p>1枚獲得、またはスキップ。${s.floor===1?'次は2Fへ進行します。':'VER.600の動作範囲はここまでです。'}</p><button data-reward="attack">攻撃カードを獲得</button><button data-reward="defense">防御カードを獲得</button><button data-reward="skip">スキップ</button><p>強撃は次段階の実装対象です。</p><button data-exit>撤退して終了</button>`;else if(terminal)$('resultPanel').innerHTML=`<h2>${escapeHtml(s.phase==='error'?'処理を停止しました':s.message)}</h2><p>${s.phase==='error'?'編成へ戻って再出撃できます。':'保存・通貨報酬の接続は未実装です。'}</p><button data-home>編成へ戻る</button>`;
}
$('board').onclick=safe(e=>{if(performance.now()-lastClick<125||gesture||!$('logSheet').hidden)return;const b=e.target.closest('[data-unit]');if(b){if(b.dataset.side==='ally')game.selectAlly(b.dataset.unit);else game.selectEnemy(b.dataset.unit)}});
$('resultPanel').onclick=safe(e=>{const b=e.target.closest('button');if(!b)return;resetGesture();if(b.hasAttribute('data-home'))game.home();else if(b.hasAttribute('data-exit'))game.retreat();else if(b.dataset.reward)game.reward(b.dataset.reward==='skip'?null:b.dataset.reward)});
function dropAt(g,x,y){const b=document.elementFromPoint(x,y)?.closest('[data-unit]');if(b){if(g.type==='defense'&&b.dataset.side==='ally')return {side:'ally',id:b.dataset.unit};if(g.type==='attack'&&b.dataset.side==='enemy'){const u=game.state.enemies.find(e=>e.instanceId===b.dataset.unit);if(u?.slot<3)return u.hp>0?{side:'enemy',id:b.dataset.unit}:false}}
 const area=$('battle').getBoundingClientRect(),hand=$('hand').getBoundingClientRect();if(x<area.left||x>area.right||y<area.top||y>area.bottom)return false;return g.rect.bottom+(y-g.y)+.07*g.rect.height/2<=hand.top+hand.height/2?null:false}

function move(e){if(pan&&e.pointerId===pan.pointer){if(Math.abs(e.clientX-pan.x)>4){$('hand').scrollLeft=pan.scroll-(e.clientX-pan.x);pan.moved=true}e.preventDefault();return}const g=gesture;if(!g||e.pointerId!==g.pointer)return;const dx=e.clientX-g.x,dy=e.clientY-g.y;g.lastX=e.clientX;g.lastY=e.clientY;if(!g.moved&&Math.hypot(dx,dy)<7)return;g.moved=true;e.preventDefault();if(!g.ghost){g.ghost=g.node.cloneNode(true);g.ghost.removeAttribute('data-card');g.ghost.className='card ghost '+g.type;Object.assign(g.ghost.style,{left:g.rect.left+'px',top:g.rect.top+'px',width:g.rect.width+'px',height:g.rect.height+'px'});document.body.append(g.ghost);g.node.classList.add('source');edgeScroll()}g.ghost.style.setProperty('--dx',dx+'px');g.ghost.style.setProperty('--dy',dy+'px');document.querySelectorAll('.dropReady').forEach(n=>n.classList.remove('dropReady'));const drop=dropAt(g,e.clientX,e.clientY);if(drop)document.querySelector(`[data-unit="${drop.id}"]`)?.classList.add('dropReady')}
function edgeScroll(){const g=gesture;if(!g?.moved)return;const r=$('hand').getBoundingClientRect();if(g.lastY>=r.top-40&&g.lastY<=r.bottom+20){const d=g.lastX-r.left<48?-1:r.right-g.lastX<48?1:0;if(d){const dist=d<0?g.lastX-r.left:r.right-g.lastX;$('hand').scrollLeft+=d*Math.min(9,Math.max(2,(48-dist)/5))}}raf=requestAnimationFrame(edgeScroll)}
function endGesture(e,cancel=false){const g=gesture;if(pan&&e.pointerId===pan.pointer){pan=null;return}if(!g||e.pointerId!==g.pointer)return;let drop=false;try{if(!cancel&&g.moved)drop=dropAt(g,e.clientX,e.clientY)}finally{resetGesture();lastClick=performance.now()}if(!cancel&&g.moved&&drop!==false)game.use(g.id,drop);else if(!cancel&&!g.moved)selectedCard=g.id;renderHand()}
$('hand').addEventListener('pointerdown',safe(e=>{if(!e.isPrimary||e.button!==0||gesture||pan||!$('logSheet').hidden)return;const node=e.target.closest('[data-card]');if(game.state.hand.length>20&&node){game.discardOverflow(node.dataset.card);return}if(!game.canInput())return;if(!node){pan={pointer:e.pointerId,x:e.clientX,scroll:$('hand').scrollLeft};$('hand').setPointerCapture(e.pointerId);return}const c=game.state.hand.find(c=>c.instanceId===node.dataset.card);gesture={pointer:e.pointerId,x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,node,rect:node.getBoundingClientRect(),id:c.instanceId,type:c.type,moved:false};$('hand').setPointerCapture(e.pointerId)}));
window.addEventListener('pointermove',safe(move),{passive:false});window.addEventListener('pointerup',safe(e=>endGesture(e)));window.addEventListener('pointercancel',safe(e=>endGesture(e,true)));$('hand').addEventListener('lostpointercapture',safe(e=>endGesture(e,true)));
$('guide').addEventListener('pointerdown',e=>{if(!game.canInput()||gesture||pan)return;pan={pointer:e.pointerId,x:e.clientX,scroll:$('hand').scrollLeft};$('guide').setPointerCapture(e.pointerId)});$('guide').addEventListener('lostpointercapture',()=>{pan=null});window.addEventListener('blur',resetGesture);window.addEventListener('pagehide',()=>{resetGesture();if(['player','enemy','reward','transition'].includes(game.state.phase))game.retreat()});document.addEventListener('visibilitychange',()=>{if(document.hidden)resetGesture()});window.addEventListener('resize',()=>{resetGesture();if(game.state.hand)renderHand()});document.addEventListener('error',e=>{if(e.target instanceof HTMLImageElement){const p=e.target.closest('.unit');if(p&&!p.querySelector('.assetError')){const n=document.createElement('span');n.className='assetError';n.textContent='画像未読込';p.append(n)}}},true);
formation();

</script></body></html>
